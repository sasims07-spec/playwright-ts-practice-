name: Playwright Tests

on:
  push:
    branches: [main] # trigger when code is pushed to main branch
  pull_request:
    branches: [main] # trigger when PR is created to main branch
  workflow_dispatch: # manual trigger from GitHub UI

permissions:
  contents: write # required for peaceiris/actions-gh-pages to push to gh-pages branch

jobs:
  test:
    name: Run Playwright Tests
    runs-on: ubuntu-latest # Linux machine (most common in CI)
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4 # pulls your repo code into runner

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20 # install Node.js version

      - name: Install dependencies
        run: npm ci # clean install (faster + reliable for CI)

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        # installs browser + required Linux dependencies

      - name: Run tests
        run: npx playwright test --project=chromium

      - name: Upload HTML Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-html-report
          path: reports/my-html-report/
          retention-days: 30

      # ── Publish HTML report to GitHub Pages ─────────────────────────────────
      - name: Publish HTML report to GitHub Pages
        if: always()
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: reports/my-html-report
